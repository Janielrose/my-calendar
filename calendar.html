<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Мой календарь</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ef;--card:#faf8f5;--ink:#1f2a52;--mut:#b8b8b8;--blue:#2f5fc4;--sat:#e8eef9;--sun:#f9eee2;--acc:#7088b4;--red:#d8514b;--line:#e6e1da;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171e;--card:#1e222b;--ink:#e3e8f5;--mut:#555b66;--blue:#8fb0ff;--sat:#222a3b;--sun:#2d2820;--acc:#5a6f9c;--line:#2c313c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171e;--card:#1e222b;--ink:#e3e8f5;--mut:#555b66;--blue:#8fb0ff;--sat:#222a3b;--sun:#2d2820;--acc:#5a6f9c;--line:#2c313c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column}
.hero{text-align:center;position:relative;margin:0 -8px}.pic{height:clamp(120px,23vh,210px);background:center/cover;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}.tw{margin-top:-38px;position:relative}.cam{position:absolute;right:12px;top:calc(8px + env(safe-area-inset-top,0px));width:36px;height:36px;border-radius:50%;background:#ffffffb0;display:flex;align-items:center;justify-content:center;font-size:17px}.s1 img{width:38px;height:38px}.s2 img{width:29px;height:29px}.s3 img,.s4 img{width:24px;height:24px}.s5 img{width:18px;height:18px}
.hero h1{font:italic 500 34px 'Cormorant Garamond',Georgia,serif;margin:0;display:inline-block;min-width:200px}
.hero button{background:none;border:0;font-size:26px;color:var(--acc);padding:0 10px}
.hero .fl{position:absolute;opacity:.35;font-size:22px;top:10px}
#cal{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 8px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;padding:6px 0;color:var(--ink)}
.wd span:nth-child(n+6){color:var(--blue)}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;overflow:hidden;min-width:0;display:flex;flex-direction:column;gap:1px}
.cell.sat{background:var(--sat)}.cell.sun{background:var(--sun)}
.cell.out .n{color:var(--mut)}.cell.out{opacity:.7}
.n{font-size:13px;position:relative;align-self:flex-start;padding:1px 4px}
.sat .n,.sun .n{color:var(--blue)}
.n.today{color:var(--red);font-weight:600}
.n.today::after{content:"";position:absolute;inset:-3px -4px -2px -4px;border:2px solid var(--red);border-radius:55% 45% 52% 48%/48% 56% 44% 52%;transform:rotate(-7deg)}
.stk{display:flex;flex-wrap:wrap;line-height:1}.stk i{font-style:normal;font-size:15px}.stk img{object-fit:contain}.stk{gap:1px}.tray img,.sl img{width:100%;height:100%;object-fit:contain;pointer-events:none}.sl img{width:38px;height:38px}.ghost img{width:56px;height:56px}
.cell b{font:500 9px/1.3 sans-serif;color:#fff;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pc{padding:8px 10px;overflow:auto;flex:none;max-height:42%}
#pc.big{flex:1;max-height:none;-webkit-user-select:text;user-select:text}
.tray{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:8px}
.tray i{font-style:normal;height:46px;padding:3px;touch-action:none;cursor:grab}
.ghost{position:fixed;font-size:38px;pointer-events:none;transform:translate(-50%,-70%);z-index:99}
#tabs{display:flex;gap:4px;padding:6px 8px;background:var(--card);border-top:1px solid var(--line)}
#tabs button{flex:1;border:0;background:none;color:var(--ink);padding:9px 2px;border-radius:14px;font-size:14px}
#tabs button.on{background:var(--sat);font-weight:600}
.btn,button.pri{border:0;border-radius:20px;padding:10px 16px;background:var(--sat);color:var(--ink);font-size:15px;display:inline-block}
.pri{background:var(--acc)!important;color:#fff!important}.wide{width:100%}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%;-webkit-user-select:text;user-select:text}
textarea{resize:none;margin:6px 0}
.row2{display:flex;gap:8px;margin:6px 0;align-items:center}
.row{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.row span{flex:1}.row button,.lnk{background:none;border:0;color:var(--acc);font-size:16px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.card p{white-space:pre-wrap;margin:6px 0}.card img,.pv img{max-width:100%;border-radius:8px;margin:4px 0}.pv img{height:60px;width:auto;margin-right:4px}
.dn{text-decoration:line-through;color:var(--mut)}
.ttl{font:italic 500 24px 'Cormorant Garamond',Georgia,serif}
small{color:var(--acc)}
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:50}
.sh{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:14px;max-height:80%;overflow:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;justify-content:space-between;align-items:center}.hd h3{margin:0;font:italic 500 26px 'Cormorant Garamond',Georgia,serif}.hd button{background:none;border:0;font-size:20px;color:var(--ink)}
.sl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.sl i{font-style:normal;font-size:28px;position:relative}.sl u{position:absolute;right:-4px;top:-6px;font-size:13px;background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;text-align:center;line-height:16px;text-decoration:none}
.add{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.add #et{flex:1 1 100%}.add input[type=time],.add select{flex:1;width:auto}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:14px;display:none;z-index:99}
</style></head><body>
<div id="app">
<div id="cal">
<div class="hero"><div class="pic" id="pic"></div><label class="cam">🖼<input type="file" id="hp" accept="image/*" hidden></label><div class="tw"><button id="pv">‹</button><h1 id="ttl"></h1><button id="nx">›</button></div></div>
<div class="wd"><span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span></div>
<div id="grid"></div></div>
<div id="pc"></div>
<div id="tabs"><button data-t="st" class="on">Стикеры</button><button data-t="ca">Календари</button><button data-t="di">Дневник</button><button data-t="li">Чек-лист</button></div>
</div><div id="toast"></div>

const twoStep=(b,fn)=>b.onclick=()=>{if(b.dataset.s)fn();else{b.dataset.s=1;b.textContent='Точно удалить?'}};

function grid(){
 const y=cur.getFullYear(),m=cur.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),rows=Math.ceil((off+dim)/7),tk=key(new Date());
 $('#ttl').textContent=MN[m]+' '+y;
 const pk=y+'-'+pad(m+1),pu=S.pics[pk]||(pk==='2026-11'?NOV:null);
 $('#pic').style.backgroundImage=pu?`url(${pu})`:`linear-gradient(135deg,hsl(${(m*30+200)%360},55%,86%),hsl(${(m*30+260)%360},45%,92%))`;
 let h='';
 for(let i=0;i<rows*7;i++){
  const d=new Date(y,m,1-off+i),k=key(d),wd=i%7;
  const ev=S.ev.filter(e=>e.d===k&&(calOf(e.cal)||{on:1}).on);
  h+=`<div class="cell${d.getMonth()!==m?' out':''}${wd==5?' sat':''}${wd==6?' sun':''}" data-k="${k}"><span class="n${k===tk?' today':''}">${d.getDate()}</span><div class="stk s${Math.min((S.st[k]||[]).length,5)}">${(S.st[k]||[]).map(s=>`<i>${sx(s)}</i>`).join('')}</div>${ev.slice(0,2).map(e=>`<b style="background:${calColor(e.cal)}">${esc(e.t)}</b>`).join('')}</div>`}
 $('#grid').style.gridTemplateRows=`repeat(${rows},1fr)`;$('#grid').innerHTML=h}

$('#grid').onclick=e=>{const c=e.target.closest('.cell');if(c)sheet(c.dataset.k)};
$('#pv').onclick=()=>{cur.setMonth(cur.getMonth()-1);grid()};
$('#hp').onchange=async e=>{const f=e.target.files[0];if(!f)return;S.pics[cur.getFullYear()+'-'+pad(cur.getMonth()+1)]=await shrink(f);save();grid();e.target.value=''};
$('#nx').onclick=()=>{cur.setMonth(cur.getMonth()+1);grid()};

function sheet(k){
 const d=new Date(k+'T00:00'),o=document.createElement('div');o.className='ov';document.body.append(o);
 const draw=()=>{o.innerHTML=`<div class="sh"><div class="hd"><h3>${d.getDate()} ${MG[d.getMonth()]}</h3><button data-x>✕</button></div>
 <div class="sl">${(S.st[k]||[]).map((s,i)=>`<i data-ds="${i}">${sx(s)}<u>×</u></i>`).join('')||'<small>Стикеров нет — перетащи их на дату</small>'}</div>
 ${S.ev.filter(e=>e.d===k).map(e=>`<div class="row"><span class="dot" style="background:${calColor(e.cal)}"></span><span>${e.time?e.time+' ':''}${esc(e.t)}</span><button data-de="${e.id}">×</button></div>`).join('')}
 <div class="add"><input id="et" placeholder="Новое событие"><input id="etm" type="time"><select id="ec">${S.cals.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('')}</select><button class="btn pri" data-add>＋</button></div></div>`};
 draw();
 o.onclick=e=>{const t=e.target;
  if(t===o||t.dataset.x!==undefined){o.remove();return}
  const ds=t.closest('[data-ds]');
  if(ds){S.st[k].splice(+ds.dataset.ds,1);if(!S.st[k].length)delete S.st[k]}
  else if(t.dataset.de){S.ev=S.ev.filter(x=>x.id!==t.dataset.de)}
  else if(t.dataset.add!==undefined){const v=o.querySelector('#et').value.trim();if(!v)return;S.ev.push({id:uid(),d:k,time:o.querySelector('#etm').value,t:v,cal:o.querySelector('#ec').value})}
  else return;
  save();grid();draw()}}

/* drag stickers */
document.addEventListener('pointerdown',e=>{
 const t=e.target.closest('.tray i');if(!t)return;const sv=t.dataset.s;
 const g=document.createElement('div');g.className='ghost';g.innerHTML=t.innerHTML;document.body.append(g);
 const mv=ev=>{g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'};mv(e);
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);g.remove();
  const c=document.elementFromPoint(ev.clientX,ev.clientY);const cell=c&&c.closest('.cell');
  if(cell&&ev.type==='pointerup'){(S.st[cell.dataset.k]=S.st[cell.dataset.k]||[]).push(sv);save();grid()}};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)});

/* tabs */
const PC=$('#pc');
function show(t){
 tab=t;
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 const big=t==='di'||t==='li';$('#cal').style.display=big?'none':'';PC.className=big?'big':'';
 ({st:vSt,ca:vCa,di:vDi,li:vLi})[t]()}
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;trayOpen=t==='st'?(tab==='st'?!trayOpen:true):trayOpen;show(t)};

function vSt(){PC.innerHTML=`<button class="btn pri wide" id="an">＋ Добавить заметку</button>${trayOpen?`<div class="tray">${STI.map((s,n)=>`<i data-s="i${n}"><img src="${s}" alt=""></i>`).join('')}</div>`:''}`;
 $('#an').onclick=()=>sheet(key(new Date()))}

function ics(txt,name){
 const id=uid();S.cals.push({id,n:name,c:'#6f9e86',on:1});let n=0;
 txt.replace(/\r?\n[ \t]/g,'').split('BEGIN:VEVENT').slice(1).forEach(b=>{
  const g=k=>(b.match(new RegExp('\\n'+k+'[^:\\n]*:([^\\r\\n]*)'))||[])[1];
  const s=g('DTSTART'),t=g('SUMMARY');if(!s||!t)return;
  const m=s.match(/(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d))?/);if(!m)return;
  S.ev.push({id:uid(),d:m[1]+'-'+m[2]+'-'+m[3],time:m[4]?m[4]+':'+m[5]:'',t:t.replace(/\\,/g,',').replace(/\\n/g,' '),cal:id});n++});
 save();toast('Импортировано событий: '+n)}

function vCa(){
 PC.innerHTML=S.cals.map(c=>`<div class="row"><input type="checkbox" style="width:auto" data-t="${c.id}" ${c.on?'checked':''}><span class="dot" style="background:${c.c}"></span><span>${esc(c.n)}</span>${S.cals.length>1?`<button data-r="${c.id}">×</button>`:''}</div>`).join('')+
 `<div class="row2"><input id="cn" placeholder="Новый календарь"><input id="cc" type="color" value="#6b84b8" style="width:52px;padding:2px"><button class="btn pri" id="ca">＋</button></div>
 <label class="btn wide" style="text-align:center">📥 Импорт из файла .ics<input id="ic" type="file" accept=".ics,text/calendar" hidden></label><div class="row2" style="margin-top:14px"><button class="btn wide" id="bk">💾 Скопировать резервную копию</button></div><textarea id="rs" rows="2" placeholder="Вставь сюда копию, чтобы восстановить"></textarea><button class="btn wide" id="rb">Восстановить</button>`;
 PC.onchange=e=>{const t=e.target;
  if(t.dataset.t){calOf(t.dataset.t).on=t.checked?1:0;save();grid()}
  if(t.id==='ic'&&t.files[0]){const f=t.files[0];f.text().then(x=>{ics(x,f.name.replace(/\.ics$/i,''));grid();vCa()})}};
 PC.onclick=e=>{const t=e.target;
  if(t.dataset.r){S.cals=S.cals.filter(c=>c.id!==t.dataset.r);S.ev=S.ev.filter(x=>x.cal!==t.dataset.r);save();grid();vCa()}
  if(t.id==='bk')navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Скопировано — вставь в Заметки'),()=>toast('Не удалось скопировать'));
  if(t.id==='rb'){try{const d=JSON.parse($('#rs').value);if(!d.cals)throw 0;S=Object.assign(S,d);save();grid();vCa();toast('Восстановлено')}catch(e){toast('Это не похоже на копию')}}
  if(t.id==='ca'){const n=$('#cn').value.trim();if(!n)return;S.cals.push({id:uid(),n,c:$('#cc').value,on:1});save();vCa()}}}

const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});

function vDi(){
 PC.onchange=PC.onclick=null;
 PC.innerHTML=`<input id="q" type="search" placeholder="🔍 Поиск по дневнику"><textarea id="dt" rows="3" placeholder="Что хочешь записать?"></textarea><div class="pv" id="pw"></div><div class="row2"><label class="btn">📷 Фото<input id="ph" type="file" accept="image/*" multiple hidden></label><button class="btn pri" id="ds" style="margin-left:auto">Сохранить</button></div><div id="dl"></div>`;
 const list=()=>{const q=$('#q').value.trim().toLowerCase();
  $('#dl').innerHTML=S.diary.filter(e=>!q||e.txt.toLowerCase().includes(q)).map(e=>`<div class="card"><small>${new Date(e.ts).toLocaleString('ru',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</small><p>${esc(e.txt)}</p>${e.img.map(s=>`<img src="${s}">`).join('')}<br><button class="lnk" data-dd="${e.id}">Удалить</button></div>`).join('')||'<small>Ничего не найдено</small>';
  document.querySelectorAll('[data-dd]').forEach(b=>twoStep(b,()=>{S.diary=S.diary.filter(x=>x.id!==b.dataset.dd);save();list()}))};
 const pv=()=>$('#pw').innerHTML=pend.map(s=>`<img src="${s}">`).join('');
 $('#q').oninput=list;
 $('#ph').onchange=async e=>{for(const f of e.target.files)pend.push(await shrink(f));pv()};
 $('#ds').onclick=()=>{const t=$('#dt').value.trim();if(!t&&!pend.length)return;S.diary.unshift({id:uid(),ts:Date.now(),txt:t,img:pend});pend=[];save();vDi()};
 pv();list()}

function vLi(){
 PC.onchange=PC.onclick=null;
 const L=S.lists.find(l=>l.id===openL);
 if(!L){
  PC.innerHTML=`<div class="row2"><input id="ln" placeholder="Название нового списка"><button class="btn pri" id="la">＋</button></div>`+(S.lists.map(l=>`<div class="card" data-o="${l.id}"><b>${esc(l.n)}</b> <small>${l.items.filter(i=>i.d).length}/${l.items.length}</small></div>`).join('')||'<small>Списков пока нет</small>');
  $('#la').onclick=()=>{const l={id:uid(),n:$('#ln').value.trim()||'Новый список',note:'',items:[]};S.lists.push(l);openL=l.id;save();vLi()};
  document.querySelectorAll('[data-o]').forEach(c=>c.onclick=()=>{openL=c.dataset.o;vLi()});return}
 PC.innerHTML=`<button class="lnk" id="lb">‹ Все списки</button><input id="lt" class="ttl" value="${esc(L.n)}"><textarea id="lnote" rows="2" placeholder="Заметка">${esc(L.note)}</textarea>${L.items.map((i,x)=>`<div class="row"><input type="checkbox" style="width:auto" data-c="${x}" ${i.d?'checked':''}><span class="${i.d?'dn':''}">${esc(i.t)}</span><button data-r="${x}">×</button></div>`).join('')}<div class="row2"><input id="li" placeholder="Новый пункт"><button class="btn pri" id="lia">＋</button></div><button class="lnk" id="lx">Удалить список</button>`;
 $('#lb').onclick=()=>{openL=null;vLi()};
 $('#lt').oninput=e=>{L.n=e.target.value;save()};$('#lnote').oninput=e=>{L.note=e.target.value;save()};
 $('#lia').onclick=()=>{const v=$('#li').value.trim();if(!v)return;L.items.push({t:v,d:0});save();vLi()};
 document.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{L.items[c.dataset.c].d=c.checked?1:0;save();vLi()});
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{L.items.splice(b.dataset.r,1);save();vLi()});
 twoStep($('#lx'),()=>{S.lists=S.lists.filter(l=>l!==L);openL=null;save();vLi()})}

grid();show('st');
</script></body></html>
